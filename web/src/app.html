  %sveltekit.head%
  <style>
    /* prevent FOUC */
    html {
      height: 100%;
      width: 100%;
    }

    body,
    html {
      margin: 0;
      padding: 0;
    }

    @keyframes delayedVisibility {
      to {
        visibility: visible;
      }
    }

    @keyframes loadspin {
      100% {
        transform: rotate(360deg);
      }
    }

    #stencil {
      --stencil-width: 150px;
      display: flex;
      width: var(--stencil-width);
      margin-left: auto;
      margin-right: auto;
      margin-top: calc(50vh - var(--stencil-width) / 2);
      margin-bottom: 100vh;
      place-items: center;
      justify-content: center;
      overflow: hidden;
      visibility: hidden;
      animation:
        0s linear 0.3s forwards delayedVisibility,
        loadspin 8s linear infinite;
    }

    .bg-immich-bg {
      background-color: white;
    }

    .dark .dark\:bg-immich-dark-bg {
      background-color: black;
    }
  </style>
  <script>
    /**
     * Prevent FOUC on page load.
     */
    const colorThemeKeyName = 'color-theme';

    let theme = localStorage.getItem(colorThemeKeyName);
    if (!theme) {
      theme = { value: 'light', system: true };
    } else if (theme === 'dark' || theme === 'light') {
      theme = { value: theme, system: false };
      localStorage.setItem(colorThemeKeyName, JSON.stringify(theme));
    } else {
      theme = JSON.parse(theme);
    }

    let themeValue = theme.value;
    if (theme.system) {
      if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        themeValue = 'dark';
      } else {
        themeValue = 'light';
      }
    }

    if (themeValue === 'light') {
      document.documentElement.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
    }
  </script>

  <link rel="stylesheet" href="/custom.css" />
</head>
